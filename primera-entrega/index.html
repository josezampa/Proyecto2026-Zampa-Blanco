<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineteca - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="body-login">
    
    <div class="contenedor-login">
        <img src="imagenes/logo_cineteca.png" alt="Logo de Cineteca" class="logo-login">
        <h1>Bienvenido a Cineteca</h1>
        <p>Ingresá tus datos para continuar</p>
        
        <form id="form-login">
            <div class="campo-form">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="Ingrese su nombre" required>
            </div>
            
            <div class="campo-form">
                <label for="clave">Clave:</label>
                <input type="password" id="clave" placeholder="Ingrese su clave" required>
            </div>
            
            <p id="mensaje-error" class="mensaje-error"></p>
            
            <button type="button" class="btn-principal btn-login" onclick="validar()">Entrar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
