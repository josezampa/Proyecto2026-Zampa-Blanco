<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Equipo de Desarrollo Cineteca">
    <meta name="description" content="Formulario para dar de alta una nueva película en el catálogo de Cineteca.">
    <meta name="keywords" content="registrar, alta pelicula, formulario, cineteca, crear">
    <title>Cineteca - Registrar Película</title>
    <link rel="icon" href="imagenes/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header id="encabezado-principal">
        <div class="cinta-filmica"></div>
        <div class="contenedor-cabecera">
            <img src="imagenes/logo_cineteca.png" alt="Logotipo oficial de Cineteca" id="logo-header">
            <h1>CINETECA</h1>
        </div>
        <nav id="navegacion-principal">
            <a href="index.html" class="enlace-nav">Inicio</a>
            <a href="registrar.html" class="enlace-nav activo">Agregar Película</a>
            <a href="perfil.html" class="enlace-nav">Perfil</a>
        </nav>
    </header>

    <main id="contenido-registro">
        <section class="formulario-contenedor">
            <h2>Registrar Película</h2>
            <form id="form-registro-pelicula">
                <div class="campo-formulario">
                    <label for="input-nombre-pelicula">Nombre:</label>
                    <input type="text" id="input-nombre-pelicula" placeholder="Título de la película" size="30" maxlength="50" onblur="validarTextoNoVacio('input-nombre-pelicula')">
                </div>

                <div class="campo-formulario">
                    <label for="input-url-portada">URL Portada:</label>
                    <input type="text" id="input-url-portada" placeholder="https://enlace-imagen.com/portada.jpg" size="30" maxlength="100">
                </div>

                <div class="campo-formulario">
                    <label for="input-director">Director:</label>
                    <input type="text" id="input-director" placeholder="Nombre del director" size="30" maxlength="40" onblur="validarTextoNoVacio('input-director')">
                </div>

                <div class="campo-formulario">
                    <label for="select-genero">Género:</label>
                    <select id="select-genero">
                        <option value="Accion">Acción</option>
                        <option value="Drama">Drama</option>
                        <option value="Comedia">Comedia</option>
                        <option value="Terror">Terror</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="input-calificacion">Calificación (1 a 10):</label>
                    <input type="text" id="input-calificacion" placeholder="Ej: 9" size="10" maxlength="2" onblur="validarCalificacion('input-calificacion')">
                </div>

                <div class="campo-formulario">
                    <label for="select-estado">Estado de la película:</label>
                    <select id="select-estado">
                        <option value="Vista">Vista</option>
                        <option value="Pendiente">Pendiente</option>
                    </select>
                </div>

                <div class="grupo-botones">
                    <button type="button" id="btn-guardar" class="boton-guardar" onclick="guardarPelicula()">Guardar</button>
                    <button type="button" id="btn-cancelar" class="boton-cancelar" onclick="limpiarFormularioRegistro()">Cancelar</button>
                </div>
            </form>
        </section>
    </main>

    <footer id="pie-pagina">
        <p>Cineteca &copy; 2026 - Todos los derechos reservados.</p>
    </footer>

    <script src="js/funciones.js"></script>
</body>
</html>
