<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Equipo de Desarrollo Cineteca">
    <meta name="description" content="Catálogo y gestión de películas vistas y pendientes de la plataforma Cineteca.">
    <meta name="keywords" content="cine, peliculas, cineteca, catalogo, resenas, cartelera">
    <title>Cineteca - Cartelera Principal</title>
    <link rel="icon" href="imagenes/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header id="encabezado-principal">
        <div class="cinta-filmica"></div>
        <div class="contenedor-cabecera">
            <img src="imagenes/logo_cineteca.png" alt="Logotipo oficial de Cineteca" id="logo-header">
            <h1>CINETECA</h1>
        </div>
        <nav id="navegacion-principal">
            <a href="index.html" class="enlace-nav activo">Inicio</a>
            <a href="registrar.html" class="enlace-nav">Agregar Película</a>
            <a href="perfil.html" class="enlace-nav">Perfil</a>
        </nav>
    </header>

    <main id="contenido-principal">
        <section class="seccion-filtros">
            <div class="grupo-busqueda">
                <label for="input-buscador">Buscar película:</label>
                <input type="text" id="input-buscador" placeholder="Escriba el título de la película..." size="30" maxlength="40" onkeyup="filtrarPorTitulo()">
                <button type="button" id="btn-buscar" class="boton-accion" onclick="filtrarPorTitulo()">Buscar</button>
            </div>

            <div class="grupo-selector">
                <label for="select-genero-filtro">Filtrar por género:</label>
                <select id="select-genero-filtro" onchange="filtrarPorGenero()">
                    <option value="todos">Todos los géneros</option>
                    <option value="Accion">Acción</option>
                    <option value="Drama">Drama</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Terror">Terror</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                </select>
            </div>
        </section>

        <section class="seccion-catalogo">
            <h2>Películas Agregadas</h2>
            <div id="grid-peliculas" class="grid-cartelera">
                <article class="tarjeta-pelicula" data-genero="Drama">
                    <img src="imagenes/portada_el_padrino.jpg" alt="Portada de la película El Padrino" class="imagen-portada">
                    <div class="info-pelicula">
                        <h3>El Padrino</h3>
                        <p><strong>Director:</strong> Francis Ford Coppola</p>
                        <p><strong>Género:</strong> Drama</p>
                        <p class="estado-vista">Estado: Vista</p>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer id="pie-pagina">
        <p>Cineteca &copy; 2026 - Todos los derechos reservados.</p>
    </footer>

    <script src="js/funciones.js"></script>
</body>
</html>
